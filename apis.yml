apis:
- name: ODIN API
  description: REST API for ODIN, Cyble's internet-scanning search engine. Twenty-seven operations across five datasets
    — Hosts (IPv4 scan results, services, ASN/geo enrichment, CVEs and exploits), Exposed Buckets (AI/ML-labelled
    cloud storage across AWS/GCP/Azure/DigitalOcean/Akamai/Linode/Alibaba/IBM), Exposed Files (categorised and labelled
    files harvested from exposed buckets), Domains (search, subdomains, WHOIS current and historical, registration
    and expiry checks), and Fields (the queryable field registry per dataset) — plus a health check. Queries use
    Lucene syntax over 400+ fields. Authentication is a single X-API-Key request header issued from the ODIN search
    console; all calls must be made over HTTPS.
  humanURL: https://docs.odin.io/api-reference/introduction
  baseURL: https://api.odin.io/
