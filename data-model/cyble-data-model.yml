note: >-
  Derived from the OpenAPI component schemas and their $ref graph. ODIN is a search index over five
  datasets, not a transactional resource model — there are no create/update/delete operations and no
  server-assigned object ids with prefixes. Entities are joined by natural keys: an IP address, a
  bucket name, a domain name, a CVE id. The spec carries two parallel copies of the host object graph
  (the bare IP* schemas and the service.* schemas) with identical field sets, which is a duplication
  in the contract rather than two real entities.
datasets:
- name: Hosts
  description: IPv4 scan results across 500+ ports, enriched with ASN, geolocation, hostnames, WHOIS, CVEs and exploits.
  key: ip
  paths:
  - "/v1/hosts/search"
  - "/v1/hosts/count"
  - "/v1/hosts/summary"
  - "/v1/hosts/{ip}"
  - "/v1/hosts/cve/{ip}"
  - "/v1/hosts/cves/{ip}/{cve}"
  - "/v1/hosts/exploits/{ip}"
  - "/v1/hosts/exploits/{ip}/{cve}"
  - "/v1/cves/all/{ip}/{page}"
- name: Exposed Buckets
  description: Cloud storage buckets discovered open on the internet, AI/ML-labelled and categorised.
  key: name
  paths:
  - "/v1/exposed/buckets/search"
  - "/v1/exposed/buckets/count"
  - "/v1/exposed/buckets/summary"
- name: Exposed Files
  description: Files harvested from exposed buckets, categorised and labelled by sensitivity.
  key: path
  paths:
  - "/v1/exposed/files/search"
  - "/v1/exposed/files/count"
  - "/v1/exposed/files/summary"
- name: Domains
  description: Domains, subdomains and WHOIS records, current and historical.
  key: domain
  paths:
  - "/v1/domain/search"
  - "/v1/domain/count"
  - "/v1/domain/subdomain/search"
  - "/v1/domain/subdomain/count"
  - "/v1/domain/whois/{domain-name}"
  - "/v1/domain/whois/{domain-name}/historical"
  - "/v1/domain/whois/{domain-name}/is-expired"
  - "/v1/domain/whois/{domain-name}/is-registered"
- name: Fields
  description: The queryable field registry per dataset — the metadata surface that makes Lucene queries writable.
  key: name
  paths:
  - "/v1/fields/hosts/{category}"
  - "/v1/fields/exposed/buckets"
  - "/v1/fields/exposed/files"
